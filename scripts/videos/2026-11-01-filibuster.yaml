id: 2026-11-01-filibuster
channel: politics
format: explainer
character: mascot_v1
topic:
  title: "Why Congress can't pass anything: the filibuster"
  type: policy_fight
  first_seen: "2026-10-31T12:00:00Z"
hook:
  spoken: "Why can't Congress pass anything? Blame one Senate rule."
  on_screen: "WHY CONGRESS CAN'T PASS ANYTHING"
  pattern: question_blame
research:
  - { url: "https://www.npr.org/sections/politics/", outlet: NPR, lean: lean_left }
